nerdfont: true
mode: session
# BEGIN terminal-theme (managed by the theme command)
theme:
  mode: dark
  custom:
    current_row_bg: "#2e383c"
    highlight_row_bg: "#414b50"
    current_worktree_fg: "#d3c6aa"
    dimmed: "#859289"
    text: "#d3c6aa"
    border: "#859289"
    help_border: "#859289"
    help_muted: "#859289"
    header: "#d699b6"
    keycap: "#d3c6aa"
    info: "#83c092"
    success: "#a7c080"
    warning: "#dbbc7f"
    danger: "#e67e80"
    accent: "#83c092"
# END terminal-theme
windows:
  - name: nvim
    panes:
      - command: nvim
        focus: true
  - name: codex
    panes:
      - command: codex --no-daemon
  - name: bash
    panes:
      - command: bash
