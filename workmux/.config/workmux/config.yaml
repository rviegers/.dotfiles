nerdfont: true
mode: session
# BEGIN terminal-theme (managed by the theme command)
theme:
  mode: dark
  custom:
    current_row_bg: "#2e3440"
    highlight_row_bg: "#3b4252"
    current_worktree_fg: "#d8dee9"
    dimmed: "#8892a6"
    text: "#d8dee9"
    border: "#8892a6"
    help_border: "#8892a6"
    help_muted: "#8892a6"
    header: "#b48ead"
    keycap: "#d8dee9"
    info: "#88c0d0"
    success: "#a3be8c"
    warning: "#ebcb8b"
    danger: "#bf616a"
    accent: "#88c0d0"
# END terminal-theme
windows:
  - name: nvim
    panes:
      - command: nvim
        focus: true
  - name: codex
    panes:
      - command: codex --no-daemon
  - name: bash
    panes:
      - command: bash
