unbind r
bind r source-file ~/.tmux.conf

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key | splitw -h     -c "#{pane_current_path}"
bind-key _ splitw -v     -c "#{pane_current_path}" 
bind  c  new-window      -c "#{pane_current_path}"

set -g allow-passthrough on

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

set -g status-style "bg=#2a273f,fg=#e0def4"
set -g status-position top
set -g status-left-length 30
set -g status-left "#[fg=#3e8fb0,bold] #S #[default] "
set -g status-right "#[fg=#908caa] #H "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style "bg=#2a273f,fg=#908caa"
set -g window-status-current-style "bg=#44415a,fg=#ebbcba,bold"
set -g window-status-activity-style "bg=#2a273f,fg=#f6c177,bold"
set -g pane-border-style "fg=#44415a"
set -g pane-active-border-style "fg=#9ccfd8"
set -g message-style "bg=#393552,fg=#e0def4"
if-shell '[ -f "$HOME/.config/terminal-theme/tmux.conf" ]' 'source-file "$HOME/.config/terminal-theme/tmux.conf"'

# Start windows and panes at 1, not 0
# This allows for more ergonomic window switching
set -g base-index 1
setw -g pane-base-index 1
